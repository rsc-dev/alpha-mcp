[project]
name = "alpha-mcp"
version = "0.1.0"
description = "Alpha MCP server: investing prompts + read-only Global.db lookups (sqlite3_rsync replica)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.5",
    "mcp>=2.2,<3",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
]

[project.scripts]
alpha-mcp = "alpha_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
